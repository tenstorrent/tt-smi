name: Build Ubuntu Packages 📦

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from'
        default: ${{ github.ref }}
        required: true
        type: string
      MAJOR:
        required: false
        type: string
      MINOR:
        required: false
        type: string
      PATCH:
        required: false
        type: string
      NUMBER_OF_COMMITS_SINCE_TAG:
        required: false
        type: string

jobs:
  build-deb:
    name: Build ${{ matrix.os }} Package
    # Only a run started on main gets the Debian signing key: the OSPO Vault
    # role binds ref main and this environment (OSPO-825).
    environment: deb-signing
    # About 3 minutes per matrix job today; the Vault step stops after 10.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "What started this ref: ${{ github.ref }}"
          echo "What started this ref: ${{ github.ref_name }}"
          echo "What started this sha: ${{ github.sha }}"
          echo "Did we get a ref pass in? ${{ inputs.ref }}"
      - name: Figure out branch name
        id: ref_name
        run: |
          echo "ref_name=${{ github.ref_name }}"
          echo "ref_name=${{ github.ref_name }}" >> $GITHUB_ENV
          if [[ -n "${{ inputs.ref }}" ]]
          then
            echo "ref_name=${{ inputs.ref }}"
            echo "ref_name=${{ inputs.ref }}" >> $GITHUB_ENV
          fi
      - run: sudo apt update
      - name: Install build dependencies
        run: |
          sudo apt install -y \
            build-essential \
            debhelper \
            dh-python \
            dh-sequence-python3 \
            git-buildpackage \
            gnupg \
            libpython3-all-dev \
            pybuild-plugin-pyproject \
            python3-all \
            python3-pip \
            python3-tomli
      # The Debian signing key comes from the OSPO Vault (OSPO-825). It goes to
      # the import step through `with:` only: not into `run:` text, the job
      # environment, a log or an artifact.
      - name: Get the Debian signing key
        id: vault
        timeout-minutes: 10
        uses: tenstorrent/.github/actions/vault-secrets@a697f1bb22ad8b488b0ac63f9a261e462179fe13 # vault-secrets-v1.0.0
        with:
          role: tenstorrent--tt-smi--deb-signing
          secrets: |
            kv/data/tenstorrent/all.debian_signing_key private | DEB_SIGNING_KEY ;
            kv/data/tenstorrent/all.debian_signing_key public | DEB_SIGNING_PUBLIC_KEY
      - name: Import GPG key
        id: gpg_key_import
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ fromJSON(steps.vault.outputs.secrets).DEB_SIGNING_KEY }}
      # The imported secret key must be the key whose public part is in Vault.
      # Prints fingerprints only.
      - name: Check the imported key against the public key
        shell: bash
        env:
          DEB_SIGNING_PUBLIC_KEY: ${{ fromJSON(steps.vault.outputs.secrets).DEB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          primary_fprs() { awk -F: '($1 == "pub" || $1 == "sec") { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }'; }
          tmp="$(mktemp -d)"
          trap 'gpgconf --homedir "$tmp" --kill all >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          printf '%s\n' "$DEB_SIGNING_PUBLIC_KEY" | gpg --homedir "$tmp" --batch --quiet --import
          vault_fpr="$(gpg --homedir "$tmp" --batch --with-colons --list-keys | primary_fprs)"
          imported_fpr="$(gpg --batch --with-colons --list-secret-keys | primary_fprs)"
          echo "Imported secret key: ${imported_fpr:-none}"
          echo "Public key from Vault: ${vault_fpr:-none}"
          if [ -z "$vault_fpr" ] || [ "$(printf '%s\n' "$vault_fpr" | wc -l)" -ne 1 ] || [ "$imported_fpr" != "$vault_fpr" ]; then
            echo "::error::The imported signing key does not match the public key from Vault."
            exit 1
          fi
      # The shared Vault action does not leave the tailnet. The build steps
      # below do not need it.
      - name: Leave tailnet
        if: ${{ always() }}
        shell: bash
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }
          else
            echo "not on the tailnet"
          fi
      - run: gpg --list-keys
      - run: gpg --list-secret-keys
      - uses: actions/checkout@v4
        name: Checkout
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true
          fetch-depth: 0
      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0
      - run: git tag
      - name: Ok Figure out version
        run: |
          if [[ -n "${{ inputs.MAJOR }}" ]]
          then
            echo "MAJOR=${{ inputs.MAJOR }}" >> $GITHUB_ENV
            echo "MAJOR=${{ inputs.MAJOR }}"
          fi

          if [[ -n "${{ inputs.MINOR }}" ]]
          then
            echo "MINOR=${{ inputs.MINOR }}" >> $GITHUB_ENV
            echo "MINOR=${{ inputs.MINOR }}"
          fi

          if [[ -n "${{ inputs.PATCH }}" ]]
          then
            echo "PATCH=${{ inputs.PATCH }}" >> $GITHUB_ENV
            echo "PATCH=${{ inputs.PATCH }}"
          fi

          if [[ -n "${{ inputs.NUMBER_OF_COMMITS_SINCE_TAG }}" ]]
          then
            echo "NUMBER_OF_COMMITS_SINCE_TAG=${{ inputs.NUMBER_OF_COMMITS_SINCE_TAG }}" >> $GITHUB_ENV
            echo "NUMBER_OF_COMMITS_SINCE_TAG=${{ inputs.NUMBER_OF_COMMITS_SINCE_TAG }}"
          fi

          if [[ -n "${{ inputs.ref }}" ]]
          then
            echo "REF=${{ inputs.ref }}" >> $GITHUB_ENV
            echo "REF=${{ inputs.ref }}"
          else
            echo "REF=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "REF=${{ github.ref_name }}"
          fi
      # Ok this needs to get up leveled somewhere so that it can be shared across Debian and Ubuntu obviously
      - run: ls -lah
      - run: |
          gbp dch \
            --debian-branch ${ref_name} \
            -R \
            -N ${MAJOR}.${MINOR}.${PATCH} \
            --spawn-editor=never
        env:
          EMAIL: releases@tenstorrent.com
          NAME: Tenstorrent Releases
      - run: |
          gbp buildpackage \
            --git-ignore-new
        #continue-on-error: true
        env:
          DEBSIGN_KEYID: ${{ steps.gpg_key_import.outputs.fingerprint }}

      - name: Move Debian packages
        run: mkdir -p artifacts && mv ../*.deb artifacts/
      - name: Copy Changelog & changes to artifacts
        run: |
          cp \
            debian/changelog \
            ../*.changes \
            artifacts/
      - name: Set environment variable for distro
        id: distro_ident
        run: |
          source /etc/os-release && \
          #echo "DISTRO_IDENT=$( echo \"${NAME}\" | sed 's/"//g' | tr '[:upper:]' '[:lower:]' )-${VERSION_ID}" \
          #      >> $GITHUB_ENV
          echo "DISTRO_IDENT=${{ matrix.os }}" >> $GITHUB_ENV
      - name: Set environment variable for deb filename
        id: deb_filename
        run: echo "DEB_FILENAME=$(basename artifacts/*.deb)" >> $GITHUB_ENV
      - name: Set environment variable for deb filename
        id: deb_filename_distro
        run: echo DEB_FILENAME_DISTRO=$(basename artifacts/*.deb | sed "s/_all/_all-${{ env.DISTRO_IDENT }}/" ) >> $GITHUB_ENV
      - name: Set environment variable for deb changes file
        id: deb_filename_changes_distro
        run: echo DEB_FILENAME_CHANGES_DISTRO=$(basename artifacts/*.changes | sed "s/_amd64/_amd64-${{ env.DISTRO_IDENT }}/" ) >> $GITHUB_ENV
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_FILENAME_DISTRO }}
          path: artifacts/${{ env.DEB_FILENAME }}
      - name: Upload Changelog
        uses: actions/upload-artifact@v4
        with:
          name: debian-changelog-${{ env.DISTRO_IDENT }}
          path: debian/changelog
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ env.DISTRO_IDENT }}.zip
          path: artifacts/
      - name: Upload Changes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_FILENAME_CHANGES_DISTRO }}
          path: artifacts/*.changes
